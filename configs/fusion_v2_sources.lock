# Fusion V2 pinned upstreams
# Release builds use exact immutable commits. The complete OnePlus OKI platform is pinned
# separately in configs/oneplus_13_16.0.9.401.lock. After that official platform is verified,
# kernel_platform/common is switched to this reviewed Fusion common commit before integration.

FUSION_COMMON_REPO=https://github.com/Zhanfg/android_kernel_common_oneplus_sm8750.git
FUSION_COMMON_COMMIT=a187d340088dc23dc5bfaadf34b4475af3ea9297

RESUKISU_REPO=https://github.com/ReSukiSU/ReSukiSU.git
# Matches the ReSukiSU generation identified in the qdykernel binary audit.
RESUKISU_COMMIT=f7829ddf548a18b851d653feb76b4a569b8fd2a4

SUSFS_REPO=https://gitlab.com/simonpunk/susfs4ksu.git
SUSFS_BRANCH=gki-android15-6.6
# Exact "Bump version to 2.3.0" milestone.
SUSFS_COMMIT=eba2a88a5ba303e3d79d08e0717b956e9cf784a1
SUSFS_KERNEL_PATCH=kernel_patches/50_add_susfs_in_gki-android15-6.6.patch
SUSFS_FS_DIR=kernel_patches/fs
SUSFS_INCLUDE_DIR=kernel_patches/include/linux

KPATCH_NEXT_REPO=https://github.com/KernelSU-Next/KPatch-Next.git
# Includes the 2026-08-30 stop_machine fix.
KPATCH_NEXT_COMMIT=456744b29efb9989445463ab29e368fa59a103c4

# Clean upstream NTSYNC source. Do not use community variants which add delayed chmod/chcon
# logic inside the driver. c301e1fe is the commit that enabled the complete upstream driver.
NTSYNC_REPO=https://github.com/torvalds/linux.git
NTSYNC_COMMIT=c301e1fefc2d6c83a2beb47e9cdd7b59a90b0067
NTSYNC_DRIVER_PATH=drivers/misc/ntsync.c
NTSYNC_UAPI_PATH=include/uapi/linux/ntsync.h

# ADIOS reference only. Upstream stable 3.2.0 has no Linux 6.6 patch; a dedicated 6.6
# backport must be created and reviewed before CONFIG_MQ_IOSCHED_ADIOS is enabled.
ADIOS_REPO=https://github.com/firelzrd/adios.git
ADIOS_COMMIT=08bf078aac99075a0bef73c2b2497574a82e4c41
ADIOS_6_6_STATUS=backport-required
