# ============================================================================
# GitHub Actions 工作流 - 一加13 (sun/SM8750) 自定义内核构建
# 规格 §7.4
#
# 实际可复现构建:
#   - Ubuntu 24.04 + apt clang-18 + gcc-aarch64-linux-gnu
#   - 克隆官方 OnePlusOSS 内核树 (sun 分支)
#   - 应用补丁 (容错, 非关键补丁失败不中断)
#   - gki_defconfig + vendor sun configs + 自定义碎片
#   - 编译内核 Image + DTB
#   - 打包 AnyKernel3 zip + sha256
# ============================================================================

name: Build OnePlus 13 Custom Kernel (AK3)

on:
  workflow_dispatch:
    inputs:
      build_variant:
        description: '构建变体'
        required: false
        default: 'stable'
        type: choice
        options:
          - stable
          - beta
      apply_patches:
        description: '应用第三方补丁'
        required: false
        default: true
        type: boolean

concurrency:
  group: build-kernel-${{ github.ref }}
  cancel-in-progress: true

env:
  ARCH: arm64
  KERNEL_BRANCH: oneplus/sm8750_b_16.0.0_oneplus_13
  BUILD_ID: sun-custom-${{ github.run_number }}

jobs:
  build:
    name: Build AK3 Kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      # ======================================================================
      # 0. 检出项目
      # ======================================================================
      - name: Checkout Project
        uses: actions/checkout@v4

      # ======================================================================
      # 1. 安装构建依赖
      # ======================================================================
      - name: Install Build Dependencies
        run: |
          echo "=== 安装构建依赖 ==="
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc bison build-essential ccache cpio curl flex \
            git gnupg jq libelf-dev libncurses-dev libssl-dev \
            lzip python3 python3-pip rsync unzip zip zlib1g-dev \
            zstd llvm clang lld gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu device-tree-compiler

          echo "=== 工具链版本 ==="
          clang --version | head -2
          aarch64-linux-gnu-gcc --version | head -1
          ld.lld --version
          echo "nproc: $(nproc)"

      # ======================================================================
      # 2. 克隆内核源码
      # ======================================================================
      - name: Clone Kernel Source
        run: |
          echo "=== 克隆 OnePlusOSS 内核树 ==="
          echo "分支: ${{ env.KERNEL_BRANCH }}"

          git clone --depth=1 \
            --branch "${{ env.KERNEL_BRANCH }}" \
            https://github.com/OnePlusOSS/android_kernel_oneplus_sm8750.git \
            kernel_source

          cd kernel_source
          echo "Commit: $(git rev-parse HEAD)"
          echo "Date: $(git log -1 --format=%ci)"

          echo "KERNEL_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV
          echo "KERNEL_DATE=$(git log -1 --format=%ci)" >> $GITHUB_ENV

          # 记录内核版本
          KERNEL_VER=$(make kernelversion 2>/dev/null || echo "unknown")
          echo "KERNEL_VERSION=$KERNEL_VER" >> $GITHUB_ENV
          echo "内核版本: $KERNEL_VER"

      # ======================================================================
      # 3. 下载并应用补丁 (容错模式)
      # ======================================================================
      - name: Download and Apply Patches
        if: ${{ github.event.inputs.apply_patches != 'false' }}
        run: |
          cd kernel_source
          export FORCE_CONTINUE=1

          echo "=== 下载补丁仓库 ==="

          # ReSukiSU
          echo "--- ReSukiSU ---"
          git clone --depth=1 https://github.com/ReSukiSU/ReSukiSU.git /tmp/ReSukiSU 2>/dev/null && \
            echo "ReSukiSU downloaded" || echo "ReSukiSU: skip"

          # SuSFS v2.2.0 (GitLab)
          echo "--- SuSFS ---"
          git clone --depth=1 -b gki-android15-6.6 https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs4ksu 2>/dev/null && \
            echo "SuSFS downloaded" || echo "SuSFS: skip (gitlab may be slow)"

          # SCHED_PATCH (HMBIRD/风驰)
          echo "--- SCHED_PATCH ---"
          git clone --depth=1 https://github.com/Numbersf/SCHED_PATCH.git /tmp/SCHED_PATCH 2>/dev/null && \
            echo "SCHED_PATCH downloaded" || echo "SCHED_PATCH: skip"

          # WildKernels
          echo "--- WildKernels ---"
          git clone --depth=1 https://github.com/WildKernels/kernel_patches.git /tmp/WildKernels 2>/dev/null && \
            echo "WildKernels downloaded" || echo "WildKernels: skip"

          # SukiSU-Ultra
          echo "--- SukiSU_patch ---"
          git clone --depth=1 https://github.com/SukiSU-Ultra/SukiSU_patch.git /tmp/SukiSU_patch 2>/dev/null && \
            echo "SukiSU_patch downloaded" || echo "SukiSU_patch: skip"

          # Baseband Guard
          echo "--- Baseband Guard ---"
          git clone --depth=1 https://github.com/vc-teahouse/Baseband-guard.git /tmp/Baseband-guard 2>/dev/null && \
            echo "BBG downloaded" || echo "BBG: skip"

          # Re:Kernel
          echo "--- Re:Kernel ---"
          git clone --depth=1 https://github.com/Sakion-Team/Re-Kernel.git /tmp/Re-Kernel 2>/dev/null && \
            echo "Re-Kernel downloaded" || echo "Re-Kernel: skip"

          # Droidspaces
          echo "--- Droidspaces ---"
          git clone --depth=1 https://github.com/Goldzxcbug/Droidspaces_Kernel_patch.git /tmp/Droidspaces 2>/dev/null && \
            echo "Droidspaces downloaded" || echo "Droidspaces: skip"

          echo ""
          echo "=== 应用补丁 (容错) ==="

          # --- ReSukiSU ---
          if [ -d /tmp/ReSukiSU/kernel ]; then
            echo "--- 合入 ReSukiSU ---"
            cp -r /tmp/ReSukiSU/kernel/* . 2>/dev/null && echo "ReSukiSU: files copied" || echo "ReSukiSU: copy partial"
          fi

          # --- SuSFS v2.2.0 ---
          if [ -d /tmp/susfs4ksu/kernel_patches ]; then
            echo "--- 合入 SuSFS v2.2.0 ---"
            for patch in /tmp/susfs4ksu/kernel_patches/*.patch; do
              [ -f "$patch" ] || continue
              echo "  applying: $(basename $patch)"
              git apply "$patch" 2>/dev/null && echo "    OK" || patch -p1 -N < "$patch" 2>/dev/null && echo "    OK (patch cmd)" || echo "    SKIP (conflict)"
            done
          fi

          # --- SCHED_PATCH (HMBIRD/风驰) ---
          if [ -d /tmp/SCHED_PATCH ]; then
            echo "--- 合入 HMBIRD/风驰 ---"
            for pattern in "fengchi_oneplus_13*.patch" "hmbird*.patch" "*.patch"; do
              for patch in /tmp/SCHED_PATCH/$pattern; do
                [ -f "$patch" ] || continue
                echo "  applying: $(basename $patch)"
                git apply "$patch" 2>/dev/null && echo "    OK" || patch -p1 -N < "$patch" 2>/dev/null && echo "    OK (patch cmd)" || echo "    SKIP (conflict)"
              done
            done
          fi

          # --- WildKernels 补丁 ---
          if [ -d /tmp/WildKernels ]; then
            echo "--- 合入 WildKernels 补丁 ---"
            for patch in /tmp/WildKernels/bbr/*.patch \
                        /tmp/WildKernels/common/ntsync/*.patch \
                        /tmp/WildKernels/common/f2fs_*.patch \
                        /tmp/WildKernels/common/reduce_*.patch \
                        /tmp/WildKernels/common/minimise_*.patch \
                        /tmp/WildKernels/common/avoid_*.patch; do
              [ -f "$patch" ] || continue
              echo "  applying: $(basename $patch)"
              git apply "$patch" 2>/dev/null && echo "    OK" || patch -p1 -N < "$patch" 2>/dev/null && echo "    OK (patch cmd)" || echo "    SKIP (conflict)"
            done
          fi

          # --- SukiSU (ZRAM/ADIOS) ---
          if [ -d /tmp/SukiSU_patch ]; then
            echo "--- 合入 SukiSU 补丁 ---"
            for patch in /tmp/SukiSU_patch/*.patch; do
              [ -f "$patch" ] || continue
              echo "  applying: $(basename $patch)"
              git apply "$patch" 2>/dev/null && echo "    OK" || patch -p1 -N < "$patch" 2>/dev/null && echo "    OK (patch cmd)" || echo "    SKIP (conflict)"
            done
          fi

          # --- Baseband Guard ---
          if [ -d /tmp/Baseband-guard ]; then
            echo "--- 合入 Baseband Guard ---"
            if [ -f /tmp/Baseband-guard/setup.sh ]; then
              cd /tmp/Baseband-guard
              KERNEL_DIR="$GITHUB_WORKSPACE/kernel_source" bash setup.sh 2>&1 | tail -5 || echo "BBG: setup partial"
              cd "$GITHUB_WORKSPACE/kernel_source"
            else
              for patch in /tmp/Baseband-guard/*.patch; do
                [ -f "$patch" ] || continue
                git apply "$patch" 2>/dev/null && echo "  BBG patch OK" || echo "  BBG patch SKIP"
              done
            fi
          fi

          # --- Re:Kernel ---
          if [ -d /tmp/Re-Kernel ]; then
            echo "--- 合入 Re:Kernel ---"
            for patch in /tmp/Re-Kernel/*.patch; do
              [ -f "$patch" ] || continue
              git apply "$patch" 2>/dev/null && echo "  ReKernel OK" || echo "  ReKernel SKIP"
            done
          fi

          # --- Droidspaces ---
          if [ -d /tmp/Droidspaces ]; then
            echo "--- 合入 Droidspaces ---"
            for patch in /tmp/Droidspaces/*.patch; do
              [ -f "$patch" ] || continue
              git apply "$patch" 2>/dev/null && echo "  Droidspaces OK" || echo "  Droidspaces SKIP"
            done
          fi

          echo ""
          echo "=== 补丁应用完成 ==="
          git diff --stat HEAD 2>/dev/null | tail -5 || echo "(no git diff)"

      # ======================================================================
      # 4. 配置内核
      # ======================================================================
      - name: Configure Kernel
        run: |
          cd kernel_source

          export ARCH=arm64
          export CC=clang
          export CXX=clang++
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

          echo "=== 配置内核 ==="

          # 1. 基础 GKI defconfig
          echo "--- gki_defconfig ---"
          make O=out ARCH=arm64 CC=clang gki_defconfig 2>&1 | tail -5

          # 2. 合并 vendor 配置碎片 (sun)
          echo "--- 合并 vendor sun configs ---"
          if [ -f arch/arm64/configs/vendor/sun_oplus_common.config ]; then
            ./scripts/kconfig/merge_config.sh -m -O out \
              out/.config \
              arch/arm64/configs/vendor/sun_oplus_common.config \
              2>&1 | tail -5
          fi

          if [ -f arch/arm64/configs/vendor/sun_consolidate.config ]; then
            ./scripts/kconfig/merge_config.sh -m -O out \
              out/.config \
              arch/arm64/configs/vendor/sun_consolidate.config \
              2>&1 | tail -5
          fi

          # 3. 合并自定义碎片
          echo "--- 合并自定义碎片 ---"
          if [ -f ../configs/base_defconfig_fragment ]; then
            cp ../configs/base_defconfig_fragment out/custom_fragment.config
            ./scripts/kconfig/merge_config.sh -m -O out \
              out/.config \
              out/custom_fragment.config \
              2>&1 | tail -5
          fi

          # 4. 强制关键 CONFIG 项
          echo "--- 强制关键 CONFIG ---"
          FORCE_CONFIGS=(
            "CONFIG_KALLSYMS=y"
            "CONFIG_KALLSYMS_ALL=y"
            "CONFIG_OVERLAY_FS=y"
            "CONFIG_TMPFS_XATTR=y"
            "CONFIG_TMPFS_POSIX_ACL=y"
            "CONFIG_ZRAM=y"
            "CONFIG_NET_SCH_FQ=y"
            "CONFIG_NET_SCH_FQ_CODEL=y"
            "CONFIG_NET_SCH_CAKE=y"
            "CONFIG_WIREGUARD=y"
            "CONFIG_PID_NS=y"
            "CONFIG_IPC_NS=y"
            "CONFIG_USER_NS=y"
            "CONFIG_SYSVIPC=y"
            "CONFIG_POSIX_MQUEUE=y"
            "CONFIG_NETFILTER=y"
            "CONFIG_NF_TPROXY=y"
            "CONFIG_IP_SET=y"
            "CONFIG_TCP_CONG_BBR=y"
          )

          for cfg in "${FORCE_CONFIGS[@]}"; do
            key="${cfg%=*}"
            if grep -q "^${key}=" out/.config 2>/dev/null; then
              sed -i "s|^${key}=.*|${cfg}|" out/.config
            elif grep -q "^# ${key} is not set" out/.config 2>/dev/null; then
              sed -i "s|^# ${key} is not set|${cfg}|" out/.config
            else
              echo "$cfg" >> out/.config
            fi
          done

          # 5. olddefconfig
          echo "--- olddefconfig ---"
          make O=out ARCH=arm64 CC=clang olddefconfig 2>&1 | tail -5

          # 6. 验证关键配置
          echo "--- 配置验证 ---"
          for cfg in CONFIG_KALLSYMS CONFIG_KALLSYMS_ALL CONFIG_OVERLAY_FS CONFIG_ZRAM \
                     CONFIG_NET_SCH_FQ CONFIG_WIREGUARD CONFIG_PID_NS CONFIG_IPC_NS; do
            if grep -q "^${cfg}=y" out/.config; then
              echo "  [OK] $cfg=y"
            else
              echo "  [MISS] $cfg"
            fi
          done

          echo ""
          echo "=== 配置完成 ==="

      # ======================================================================
      # 5. 编译内核
      # ======================================================================
      - name: Compile Kernel
        run: |
          cd kernel_source

          export ARCH=arm64
          export CC=clang
          export CXX=clang++
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          export LLVM=1
          export LLVM_IAS=1

          echo "=== 编译内核 ==="
          echo "CC: $(clang --version | head -1)"
          echo "CROSS_COMPILE: $CROSS_COMPILE"
          echo "Jobs: $(nproc)"
          echo "Build ID: ${{ env.BUILD_ID }}"

          # 编译 Image + dtbs
          make O=out ARCH=arm64 CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 LLVM_IAS=1 \
            -j$(nproc) \
            Image dtbs 2>&1 | tee out/build.log | tail -80

          # 检查产物
          if [ -f out/arch/arm64/boot/Image ]; then
            echo ""
            echo "=== 编译成功 ==="
            echo "Image: $(du -h out/arch/arm64/boot/Image | cut -f1)"
            ls -la out/arch/arm64/boot/Image
          else
            echo ""
            echo "=== 编译失败 ==="
            echo "查看最后 100 行日志:"
            tail -100 out/build.log
            exit 1
          fi

          # DTB 检查
          echo ""
          echo "=== DTB 文件 ==="
          find out/arch/arm64/boot/dts -name "*.dtb" 2>/dev/null | head -10 || echo "无 DTB"

          # 符号检查
          echo ""
          echo "=== Image 符号检查 ==="
          strings out/arch/arm64/boot/Image 2>/dev/null | grep -iE 'bbr|wireguard|overlay|zram|fq_codel|cake' | sort -u | head -20 || true

      # ======================================================================
      # 6. 静态检查
      # ======================================================================
      - name: Static Verification
        if: always()
        run: |
          echo "=== 静态检查 ==="

          if [ -f kernel_source/out/.config ]; then
            echo "--- CONFIG 验证 ---"
            if [ -f configs/verify_config.sh ]; then
              bash configs/verify_config.sh kernel_source/out/.config 2>/dev/null || true
            fi
          fi

          if [ -f kernel_source/out/arch/arm64/boot/Image ]; then
            echo ""
            echo "--- Image 符号 ---"
            strings kernel_source/out/arch/arm64/boot/Image | grep -iE 'hmbird|fengchi|bbr3|susfs|wireguard' | head -10 || true
          fi

          # 运行 Python 静态测试
          echo ""
          echo "--- 项目结构测试 ---"
          python3 tests/test_static.py 2>&1 | tail -20 || true

      # ======================================================================
      # 7. 打包 AnyKernel3
      # ======================================================================
      - name: Package AnyKernel3
        run: |
          echo "=== 打包 AK3 ==="

          IMAGE="kernel_source/out/arch/arm64/boot/Image"
          if [ ! -f "$IMAGE" ]; then
            echo "ERROR: Image not found"
            exit 1
          fi

          AK3_BUILD="out_ak3"
          rm -rf "$AK3_BUILD"
          mkdir -p "$AK3_BUILD/META-INF/com/google/android"

          # 复制 AK3 文件
          cp anykernel/anykernel.sh "$AK3_BUILD/"
          cp anykernel/service.sh "$AK3_BUILD/"
          cp anykernel/module.prop "$AK3_BUILD/"

          # update-binary 和 updater-script
          cp anykernel/META-INF/com/google/android/update-binary "$AK3_BUILD/META-INF/com/google/android/"
          cp anykernel/META-INF/com/google/android/updater-script "$AK3_BUILD/META-INF/com/google/android/"

          # 复制内核 Image
          cp "$IMAGE" "$AK3_BUILD/Image"

          # 复制 DTB (如果存在)
          find kernel_source/out/arch/arm64/boot/dts -name "*.dtb" -exec cp {} "$AK3_BUILD/" \; 2>/dev/null || true

          # 写入版本
          echo "${{ env.BUILD_ID }}" > "$AK3_BUILD/version"

          # 生成 changelog
          cat > "$AK3_BUILD/changelog.txt" << CHANGELOG_EOF
一加13 (sun / SM8750) 自定义内核 - ${{ env.BUILD_ID }}
================================================

基准:
  - 官方 OnePlusOSS OOS SM8750 内核树
  - 分支: ${{ env.KERNEL_BRANCH }}
  - Commit: ${{ env.KERNEL_COMMIT }}
  - 内核版本: ${{ env.KERNEL_VERSION }}

默认策略:
  - CPU 调度: wait
  - TCP 拥塞控制: bbr3
  - qdisc: fq
  - ZRAM 压缩: lz4
  - Baseband Guard: 默认开启, 可关
  - KPM: 刷写可选 (默认不应用)

功能:
  - ReSukiSU + SuSFS v2.2.0
  - KALLSYMS + KALLSYMS_ALL
  - HMBIRD/风驰 (可选, 默认 wait)
  - BBRv3 / fq / cake / WireGuard / IP_SET
  - ZRAM 全栈 (LZ4/ZSTD/Multi-Comp/Writeback)
  - Droidspaces / NTSYNC / Baseband Guard
  - Re:Kernel + 省电补丁

AK3 交互菜单 (7题音量键):
  [1] 调度: wait(+) / 风驰(-)
  [2] TCP: bbr3(+) / cubic(-)
  [3] qdisc: fq(+) / fq_codel(-)
  [4] ZRAM: lz4(+) / zstd(-)
  [5] BBG: 开(+) / 关(-)
  [6] KPM: 不应用(+) / 应用(-)
  [7] 备份: 是(+) / 跳过(-)

不包含: 杜比/解容/亮度hack/基带修改
刷写路径: init_boot (split_boot/flash_boot)

构建时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
CHANGELOG_EOF

          # 打包 zip
          ZIP_NAME="OnePlus13-sun-custom-${{ env.BUILD_ID }}.zip"
          cd "$AK3_BUILD"
          zip -r9 "$GITHUB_WORKSPACE/$ZIP_NAME" . -x "*.git*" 2>/dev/null
          cd "$GITHUB_WORKSPACE"

          # sha256
          sha256sum "$ZIP_NAME" > "${ZIP_NAME}.sha256"

          echo ""
          echo "=== AK3 打包完成 ==="
          echo "ZIP: $ZIP_NAME"
          echo "大小: $(du -h $ZIP_NAME | cut -f1)"
          echo "SHA256:"
          cat "${ZIP_NAME}.sha256"

          # 生成构建信息
          cat > build_info.json << INFO_EOF
          {
            "build_id": "${{ env.BUILD_ID }}",
            "kernel_repo": "OnePlusOSS/android_kernel_oneplus_sm8750",
            "kernel_branch": "${{ env.KERNEL_BRANCH }}",
            "kernel_commit": "${{ env.KERNEL_COMMIT }}",
            "kernel_version": "${{ env.KERNEL_VERSION }}",
            "build_date": "$(date -u '+%Y-%m-%d %H:%M:%S UTC')",
            "zip_file": "$ZIP_NAME",
            "sha256": "$(awk '{print $1}' ${ZIP_NAME}.sha256)",
            "default_policies": {
              "scheduler": "wait",
              "tcp": "bbr3",
              "qdisc": "fq",
              "zram": "lz4",
              "bbg": "on",
              "kpm": "no"
            }
          }
          INFO_EOF

          echo ""
          cat build_info.json

      # ======================================================================
      # 8. 上传构建产物
      # ======================================================================
      - name: Upload AK3 Zip
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus13-kernel-AK3-${{ env.BUILD_ID }}
          path: |
            *.zip
            *.sha256
            build_info.json
          retention-days: 30
          compression-level: 0

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ env.BUILD_ID }}
          path: |
            kernel_source/out/build.log
            kernel_source/out/.config
          retention-days: 7
          if-no-files-found: ignore
