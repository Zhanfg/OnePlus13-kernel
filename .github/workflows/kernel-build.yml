name: Kernel Build AK3

on:
  workflow_dispatch:
    inputs:
      build_variant:
        description: 'Build variant'
        required: false
        default: 'stable'
        type: choice
        options:
          - stable
          - beta
      apply_patches:
        description: 'Apply third-party patches'
        required: false
        default: true
        type: boolean

concurrency:
  group: kernel-build
  cancel-in-progress: true

env:
  ARCH: arm64
  KERNEL_BRANCH: oneplus/sm8750_b_16.0.0_oneplus_13
  BUILD_ID: sun-custom-${{ github.run_number }}

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison build-essential ccache cpio curl flex git jq libelf-dev libncurses-dev libssl-dev lzip python3 rsync unzip zip zlib1g-dev zstd llvm clang lld gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu device-tree-compiler
          clang --version | head -1
          aarch64-linux-gnu-gcc --version | head -1

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 --branch "${{ env.KERNEL_BRANCH }}" https://github.com/OnePlusOSS/android_kernel_oneplus_sm8750.git kernel_source
          cd kernel_source
          echo "KERNEL_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV
          echo "KERNEL_DATE=$(git log -1 --format=%ci)" >> $GITHUB_ENV
          KERNEL_VER=$(make kernelversion 2>/dev/null || echo "unknown")
          echo "KERNEL_VERSION=$KERNEL_VER" >> $GITHUB_ENV
          echo "Kernel version: $KERNEL_VER"

      - name: Download and Apply Patches
        if: ${{ github.event.inputs.apply_patches != 'false' }}
        run: |
          cd kernel_source
          echo "=== Downloading patch repos ==="
          git clone --depth=1 https://github.com/ReSukiSU/ReSukiSU.git /tmp/ReSukiSU 2>/dev/null && echo "ReSukiSU OK" || echo "ReSukiSU skip"
          git clone --depth=1 -b gki-android15-6.6 https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs4ksu 2>/dev/null && echo "SuSFS OK" || echo "SuSFS skip"
          git clone --depth=1 https://github.com/Numbersf/SCHED_PATCH.git /tmp/SCHED_PATCH 2>/dev/null && echo "SCHED_PATCH OK" || echo "SCHED_PATCH skip"
          git clone --depth=1 https://github.com/WildKernels/kernel_patches.git /tmp/WildKernels 2>/dev/null && echo "WildKernels OK" || echo "WildKernels skip"
          git clone --depth=1 https://github.com/SukiSU-Ultra/SukiSU_patch.git /tmp/SukiSU_patch 2>/dev/null && echo "SukiSU OK" || echo "SukiSU skip"
          git clone --depth=1 https://github.com/vc-teahouse/Baseband-guard.git /tmp/Baseband-guard 2>/dev/null && echo "BBG OK" || echo "BBG skip"
          git clone --depth=1 https://github.com/Sakion-Team/Re-Kernel.git /tmp/Re-Kernel 2>/dev/null && echo "ReKernel OK" || echo "ReKernel skip"
          git clone --depth=1 https://github.com/Goldzxcbug/Droidspaces_Kernel_patch.git /tmp/Droidspaces 2>/dev/null && echo "Droidspaces OK" || echo "Droidspaces skip"
          echo "=== Applying patches (tolerant) ==="
          if [ -d /tmp/ReSukiSU/kernel ]; then cp -r /tmp/ReSukiSU/kernel/* . 2>/dev/null; echo "ReSukiSU applied"; fi
          for repo in susfs4ksu/kernel_patches SCHED_PATCH WildKernels/bbr WildKernels/common/ntsync WildKernels/common SukiSU_patch Re-Kernel Droidspaces; do
            dir="/tmp/$repo"
            [ -d "$dir" ] || continue
            for patch in "$dir"/*.patch; do
              [ -f "$patch" ] || continue
              git apply "$patch" 2>/dev/null && echo "  OK: $(basename $patch)" || patch -p1 -N < "$patch" 2>/dev/null && echo "  OK: $(basename $patch) (patch)" || echo "  SKIP: $(basename $patch)"
            done
          done
          if [ -f /tmp/Baseband-guard/setup.sh ]; then
            cd /tmp/Baseband-guard && KERNEL_DIR="$GITHUB_WORKSPACE/kernel_source" bash setup.sh 2>&1 | tail -3; cd "$GITHUB_WORKSPACE/kernel_source"
          fi
          echo "=== Patches done ==="
          git diff --stat HEAD 2>/dev/null | tail -5 || true

      - name: Configure Kernel
        run: |
          cd kernel_source
          export ARCH=arm64 CC=clang CXX=clang++
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          make O=out ARCH=arm64 CC=clang gki_defconfig 2>&1 | tail -3
          if [ -f arch/arm64/configs/vendor/sun_oplus_common.config ]; then
            ./scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/vendor/sun_oplus_common.config 2>&1 | tail -3
          fi
          if [ -f arch/arm64/configs/vendor/sun_consolidate.config ]; then
            ./scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/vendor/sun_consolidate.config 2>&1 | tail -3
          fi
          if [ -f ../configs/base_defconfig_fragment ]; then
            cp ../configs/base_defconfig_fragment out/custom.config
            ./scripts/kconfig/merge_config.sh -m -O out out/.config out/custom.config 2>&1 | tail -3
          fi
          for cfg in "CONFIG_KALLSYMS=y" "CONFIG_KALLSYMS_ALL=y" "CONFIG_OVERLAY_FS=y" "CONFIG_TMPFS_XATTR=y" "CONFIG_TMPFS_POSIX_ACL=y" "CONFIG_ZRAM=y" "CONFIG_NET_SCH_FQ=y" "CONFIG_NET_SCH_FQ_CODEL=y" "CONFIG_NET_SCH_CAKE=y" "CONFIG_WIREGUARD=y" "CONFIG_PID_NS=y" "CONFIG_IPC_NS=y" "CONFIG_USER_NS=y" "CONFIG_SYSVIPC=y" "CONFIG_POSIX_MQUEUE=y" "CONFIG_NETFILTER=y" "CONFIG_NF_TPROXY=y" "CONFIG_IP_SET=y" "CONFIG_TCP_CONG_BBR=y"; do
            key="${cfg%=*}"
            if grep -q "^${key}=" out/.config 2>/dev/null; then sed -i "s|^${key}=.*|${cfg}|" out/.config
            elif grep -q "^# ${key} is not set" out/.config 2>/dev/null; then sed -i "s|^# ${key} is not set|${cfg}|" out/.config
            else echo "$cfg" >> out/.config; fi
          done
          make O=out ARCH=arm64 CC=clang olddefconfig 2>&1 | tail -3
          echo "=== Config verification ==="
          for cfg in CONFIG_KALLSYMS CONFIG_KALLSYMS_ALL CONFIG_OVERLAY_FS CONFIG_ZRAM CONFIG_NET_SCH_FQ CONFIG_WIREGUARD; do
            grep -q "^${cfg}=y" out/.config && echo "  [OK] $cfg" || echo "  [MISS] $cfg"
          done

      - name: Compile Kernel
        run: |
          cd kernel_source
          export ARCH=arm64 CC=clang CXX=clang++
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          export LLVM=1 LLVM_IAS=1
          echo "=== Compiling kernel (Build ID: ${{ env.BUILD_ID }}) ==="
          make O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 -j$(nproc) Image dtbs 2>&1 | tee out/build.log | tail -80
          if [ -f out/arch/arm64/boot/Image ]; then
            echo "=== BUILD SUCCESS ==="
            echo "Image size: $(du -h out/arch/arm64/boot/Image | cut -f1)"
          else
            echo "=== BUILD FAILED ==="
            tail -100 out/build.log
            exit 1
          fi
          echo "=== DTB files ==="
          find out/arch/arm64/boot/dts -name "*.dtb" 2>/dev/null | head -5 || true
          echo "=== Symbol check ==="
          strings out/arch/arm64/boot/Image | grep -iE 'bbr|wireguard|overlay|zram' | sort -u | head -10 || true

      - name: Package AnyKernel3
        run: |
          IMAGE="kernel_source/out/arch/arm64/boot/Image"
          if [ ! -f "$IMAGE" ]; then echo "ERROR: Image not found"; exit 1; fi
          AK3="out_ak3"
          rm -rf "$AK3" && mkdir -p "$AK3/META-INF/com/google/android"
          cp anykernel/anykernel.sh "$AK3/"
          cp anykernel/service.sh "$AK3/"
          cp anykernel/module.prop "$AK3/"
          cp anykernel/META-INF/com/google/android/update-binary "$AK3/META-INF/com/google/android/"
          cp anykernel/META-INF/com/google/android/updater-script "$AK3/META-INF/com/google/android/"
          cp "$IMAGE" "$AK3/Image"
          find kernel_source/out/arch/arm64/boot/dts -name "*.dtb" -exec cp {} "$AK3/" \; 2>/dev/null || true
          echo "${{ env.BUILD_ID }}" > "$AK3/version"
          printf 'OnePlus 13 (sun/SM8750) Custom Kernel - %s\nBase: OnePlusOSS OOS SM8750\nCommit: %s\nKernel: %s\nDefaults: wait + bbr3 + fq + lz4 + BBG on + KPM no\nBuild: %s\n' "${{ env.BUILD_ID }}" "${{ env.KERNEL_COMMIT }}" "${{ env.KERNEL_VERSION }}" "$(date -u '+%Y-%m-%d %H:%M:%S UTC')" > "$AK3/changelog.txt"
          ZIP="OnePlus13-sun-custom-${{ env.BUILD_ID }}.zip"
          cd "$AK3" && zip -r9 "$GITHUB_WORKSPACE/$ZIP" . -x "*.git*" 2>/dev/null && cd "$GITHUB_WORKSPACE"
          sha256sum "$ZIP" > "${ZIP}.sha256"
          echo "=== AK3 Package Complete ==="
          echo "ZIP: $ZIP"
          echo "Size: $(du -h $ZIP | cut -f1)"
          cat "${ZIP}.sha256"

      - name: Upload AK3
        uses: actions/upload-artifact@v4
        with:
          name: AK3-${{ env.BUILD_ID }}
          path: |
            *.zip
            *.sha256
          retention-days: 30
          compression-level: 0

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ env.BUILD_ID }}
          path: |
            kernel_source/out/build.log
            kernel_source/out/.config
          if-no-files-found: ignore
          retention-days: 7
